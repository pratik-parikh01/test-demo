name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-service/requirements.txt
            python-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v

  node:
    name: Node — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (jest)
        run: npm test

  publish:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [python, node]
    # Only push images from the main branch; still builds (no push) on PRs so
    # you can catch Dockerfile issues early.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push — python-service
        uses: docker/build-push-action@v6
        with:
          context: ./python-service
          push: ${{ github.ref == 'refs/heads/main' }}
          # TODO: replace with your image name, e.g. myorg/users-service
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/python-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/python-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — node-service
        uses: docker/build-push-action@v6
        with:
          context: ./node-service
          push: ${{ github.ref == 'refs/heads/main' }}
          # TODO: replace with your image name, e.g. myorg/products-service
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/node-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/node-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
